version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: superhero-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: superhero-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/superheroes
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    container_name: superhero-frontend
    ports:
      - "5173:5173"
      - "5001:5001"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  mongo-data:
